<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise Linux Health Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <a href="{{ url_for('dashboard.index') }}" style="display:flex;align-items:center;gap:12px;">
                    <img src="{{ url_for('static', filename='images/linux_logo.png') }}" alt="Enterprise Linux Logo" style="width:34px;height:34px;border-radius:8px;object-fit:contain;background:#ffffff;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                    <span>Enterprise Linux Health Dashboard</span>
                </a>
            </div>
            <div class="nav-right-user-area">
                <div class="user-profile-badge">
                    <div class="user-avatar-circle">
                        <i data-lucide="user" style="width:18px;height:18px;color:#ffffff;"></i>
                    </div>
                    <div class="user-info-text">
                        <span class="user-welcome-sub">Welcome back,</span>
                        <span class="user-name-title">{{ user if user else 'Prathap' }}</span>
                    </div>
                </div>
                {% if auth_enabled %}
                <a href="{{ url_for('auth.logout') }}" class="header-white-logout-btn">
                    <i data-lucide="log-out" style="width:16px;height:16px;"></i> Logout
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="page-footer">
        <p>Enterprise Linux Health Dashboard &copy; 2026 | Production Monitoring Platform</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.lucide) { lucide.createIcons(); }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
