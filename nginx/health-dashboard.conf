# =============================================================================
# Enterprise Linux Health Dashboard - Nginx Configuration
# =============================================================================
# Serves the health dashboard and reports on port 8088.
#
# Installation:
#   RHEL: cp health-dashboard.conf /etc/nginx/conf.d/
#   Ubuntu: cp health-dashboard.conf /etc/nginx/sites-available/
#           ln -s /etc/nginx/sites-available/health-dashboard.conf /etc/nginx/sites-enabled/
#   Then: nginx -t && systemctl reload nginx
# =============================================================================

server {
    listen 8088;
    server_name _;

    # Document root - health reports directory
    root /var/www/html/health-reports;
    index index.html;

    # Access and error logs
    access_log /var/log/nginx/health-dashboard-access.log;
    error_log  /var/log/nginx/health-dashboard-error.log;

    # Main dashboard
    location / {
        try_files $uri $uri/ /index.html;
        autoindex off;
    }

    # Serve static assets (CSS, JS, images)
    location /static/ {
        alias /var/www/html/health-reports/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve individual host reports
    location ~ ^/([a-zA-Z0-9._-]+)/ {
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression for performance
    gzip on;
    gzip_types text/plain text/css text/html application/javascript application/json;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Client body size limit for uploads (not used here, but safe default)
    client_max_body_size 50M;

    # Disable server version in response headers
    server_tokens off;
}
