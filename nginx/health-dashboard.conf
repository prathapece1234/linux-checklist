# =============================================================================
# Enterprise Linux Health Dashboard - Nginx Configuration
# =============================================================================
# Serves the health dashboard and reports on port 8088.
# =============================================================================

server {
    listen 8088;
    server_name _;

    # Access and error logs
    access_log /var/log/nginx/health-dashboard-access.log;
    error_log  /var/log/nginx/health-dashboard-error.log;

    # Main dashboard
    location / {
        alias /var/www/html/health-reports/;
        index index.html;
        try_files $uri $uri/ /index.html;
        autoindex off;
    }

    # Serve static assets (CSS, JS, images)
    location /static/ {
        alias /var/www/html/health-reports/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve individual host reports
    location ~ ^/([a-zA-Z0-9._-]+)/ {
        root /var/www/html/health-reports;
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression for performance
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Client body size limit for uploads
    client_max_body_size 50M;

    # Disable server version in response headers
    server_tokens off;
}
