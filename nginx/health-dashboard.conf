# =============================================================================
# Enterprise Linux Health Dashboard - Nginx Reverse Proxy Configuration
# =============================================================================
# Nginx acts as a reverse proxy to Gunicorn (Flask) on port 5000.
# Dashboard is served on port 8088.
# =============================================================================

server {
    listen 8088;
    server_name _;

    access_log /var/log/nginx/health-dashboard-access.log;
    error_log  /var/log/nginx/health-dashboard-error.log;

    # Reverse proxy all requests to Gunicorn/Flask
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
    }

    # Serve raw report files directly for iframe loading performance
    location /reports/ {
        alias /var/www/html/health-reports/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Client body size limit for uploads
    client_max_body_size 50M;

    # Disable server version
    server_tokens off;
}
