server {

    listen 8088;
    server_name _;

    auth_basic "Enterprise Linux Health Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /var/www/html/health-reports;
    index index.html;

    access_log /var/log/nginx/health-dashboard-access.log;
    error_log  /var/log/nginx/health-dashboard-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /var/www/html/health-reports/static/;
        expires 7d;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    client_max_body_size 50M;

    server_tokens off;
}
